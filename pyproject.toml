[project]
name = "hanoi-crossing"
version = "0.1.0"
description = "Hanoi Crossing Game"
readme = "README.md"
authors = [
    { name = "Joseph Nkumah", email = "josephnkumah97@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]